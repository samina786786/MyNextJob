<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MyNextJob">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="clay" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feOffset dx="6" dy="8" in="b" result="o" />
      <feComponentTransfer in="o" result="s">
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="s" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Warm ivory rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#F6F3EA" />

  <!-- Emerald "compass arrow" mark -->
  <g filter="url(#clay)" transform="translate(96 96)">
    <rect x="0" y="0" width="320" height="320" rx="72" fill="url(#g)" />
    <path
      d="M160 68 L232 232 L160 196 L88 232 Z"
      fill="#F6F3EA"
      stroke="#F6F3EA"
      stroke-width="6"
      stroke-linejoin="round"
    />
  </g>
</svg>
